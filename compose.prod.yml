services:
  api:
    image: ${BACKEND_IMAGE}:${IMAGE_TAG}
    env_file:
      - .env
    environment:
      # Only Cloudflare may set the client address: https://www.cloudflare.com/ips-v4
      FORWARDED_ALLOW_IPS: "173.245.48.0/20,103.21.244.0/22,103.22.200.0/22,103.31.4.0/22,141.101.64.0/18,108.162.192.0/18,190.93.240.0/20,188.114.96.0/20,197.234.240.0/22,198.41.128.0/17,162.158.0.0/15,104.16.0.0/13,104.24.0.0/14,172.64.0.0/13,131.0.72.0/22"
    command:
      - uv
      - run
      - --no-dev
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
      - --ssl-certfile
      - /certs/origin.pem
      - --ssl-keyfile
      - /certs/origin.key
      # realtime socket: frames are small control messages; open sockets get 10 s to close on deploy
      - --ws-max-size
      - "65536"
      - --timeout-graceful-shutdown
      - "10"
    restart: unless-stopped
    # journald keeps logs across deploys (a container's own log goes with it); size is capped on the host
    logging:
      driver: journald
      options:
        tag: overwatch-api
    ports:
      - "443:8000"
    volumes:
      - repo-data:/srv/app/repos
      - ./certs:/certs:ro

volumes:
  repo-data:
