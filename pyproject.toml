[project]
name = "overwatch-backend"
version = "0.1.0"
description = "Overwatch eval-1 backend: FastAPI + MongoDB + Neo4j + GitHub/Jira connectors + Gemini-grounded graph Q&A"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.51",
    "pydantic-settings>=2.6",
    "structlog>=26.1.0",
    "pyjwt>=2.13.0",
    "cryptography>=49.0.0",
    "motor>=3.7.1",
    "neo4j>=6.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.28",
    "mongomock-motor>=0.0.36",
    "respx>=0.23.1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "regression: snapshot-style regression tests (run in isolation with -m regression)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
